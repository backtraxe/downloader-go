version: 2

# Tag 带预发布后缀（如 v0.1.0-rc.2）时自动标为 prerelease，避免占用正式版本。
release:
  prerelease: auto

builds:
  - main: ./cmd/downloader
    binary: downloader
    env: [CGO_ENABLED=0]
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE
      - NOTICE
      - internal/douyinsign/LICENSE.apache

checksum:
  name_template: checksums.txt
